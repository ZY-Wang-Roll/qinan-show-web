<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹿映秦华 · 内容管理后台</title>
<style>
:root {
  --bg: #faf8f5; --surface: #fff; --fg: #1a1a1a; --muted: #5c534c;
  --border: #e8e3dc; --accent: #c4a682; --accent-deep: #a88b6a;
  --danger: #c44; --success: #5a8; --warm-50: #faf8f5;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: "PingFang SC","Noto Sans SC",system-ui,sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; display:flex; flex-direction:column; }

/* ========== HEADER ========== */
.top-bar { background:var(--fg); color:#fff; padding:4px 24px; font-size:11px; display:flex; align-items:center; justify-content:space-between; letter-spacing:.04em; }
.top-bar a { color:rgba(255,255,255,.6); text-decoration:none; transition:color .2s; }
.top-bar a:hover { color:#fff; }
.top-bar .dot { width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:4px; }
.top-bar .dot.green { background:#5a8; }
.header { background:var(--surface); border-bottom:1px solid var(--border); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
.header-left { display:flex; align-items:center; gap:16px; }
.header-logo { font-size:24px; font-weight:700; letter-spacing:.08em; color:var(--fg); text-decoration:none; }
.header-logo span { color:var(--accent-deep); }
.header-divider { width:1px; height:28px; background:var(--border); }
.header-breadcrumb { font-size:13px; color:var(--muted); letter-spacing:.03em; }
.header-right { display:flex; align-items:center; gap:12px; }
.header-link { font-size:12px; color:var(--accent-deep); text-decoration:none; padding:6px 14px; border:1px solid var(--border); border-radius:4px; transition:all .2s; letter-spacing:.04em; }
.header-link:hover { background:rgba(196,166,130,.08); border-color:var(--accent); }

/* ========== LAYOUT ========== */
.layout { display:flex; flex:1; }
.sidebar { width:210px; background:var(--surface); border-right:1px solid var(--border); padding:12px 0; flex-shrink:0; }
.sidebar-group { padding:8px 24px 4px; font-size:10px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; }
.sidebar a { display:flex; align-items:center; gap:8px; padding:11px 24px; font-size:13px; color:var(--muted); text-decoration:none; letter-spacing:.04em; transition:all .2s; }
.sidebar a:hover, .sidebar a.active { color:var(--accent-deep); background:rgba(196,166,130,.08); }
.sidebar a .ico { font-size:15px; width:20px; text-align:center; }
.main { flex:1; padding:24px 32px 48px; overflow-y:auto; max-height:calc(100vh - 104px); }
.section { display:none; }
.section.active { display:block; animation:fadeIn .3s; }
.section h2 { font-size:22px; font-weight:700; margin-bottom:8px; letter-spacing:.03em; }
.section .section-desc { font-size:12px; color:var(--muted); margin-bottom:24px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:24px; margin-bottom:16px; }
.card h3 { font-size:15px; font-weight:600; margin-bottom:12px; color:var(--accent-deep); display:flex; align-items:center; gap:8px; }
.card h3 .badge { font-size:10px; background:var(--accent); color:#fff; padding:2px 8px; border-radius:10px; font-weight:400; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; letter-spacing:.05em; font-weight:500; }
.form-group input, .form-group textarea, .form-group select {
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px;
  font-size:13px; font-family:inherit; background:var(--bg); transition:border .2s,box-shadow .2s;
}
.form-group input:focus, .form-group textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(196,166,130,.12); }
.form-group textarea { min-height:80px; resize:vertical; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-inline { display:flex; gap:8px; align-items:end; }
.form-inline .form-group { flex:1; margin-bottom:0; }
.btn { padding:10px 20px; border:none; border-radius:6px; font-size:13px; cursor:pointer; letter-spacing:.04em; transition:all .2s; font-weight:500; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent-deep); }
.btn-outline { background:transparent; color:var(--accent-deep); border:1px solid var(--accent); }
.btn-outline:hover { background:rgba(196,166,130,.08); }
.btn-danger { background:var(--danger); color:#fff; }
.btn-danger:hover { opacity:.85; }
.btn-sm { padding:5px 12px; font-size:11px; }
.btn-group { display:flex; gap:8px; margin-top:16px; }
.tag-list { display:flex; flex-wrap:wrap; gap:6px; }
.tag-item { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; background:rgba(196,166,130,.08); border:1px solid rgba(196,166,130,.15); border-radius:3px; font-size:11px; }
.tag-item button { background:none; border:none; color:var(--danger); cursor:pointer; font-size:14px; padding:0 2px; }

/* ========== IMAGES ========== */
.image-upload-area { display:flex; gap:12px; align-items:end; }
.image-upload-area .form-group { flex:1; margin-bottom:0; }
.image-preview { width:160px; height:100px; border:1px dashed var(--border); border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; overflow:hidden; }
.image-preview img { width:100%; height:100%; object-fit:cover; }
.image-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
.image-card { border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.image-card img { width:100%; height:110px; object-fit:cover; display:block; }
.image-card .info { padding:8px 10px; font-size:11px; color:var(--muted); }
.image-card .info .url-copy { width:100%; font-size:10px; margin-top:4px; padding:3px; border:1px solid var(--border); border-radius:3px; cursor:pointer; }

/* ========== TOAST ========== */
.toast { position:fixed; top:16px; right:16px; padding:12px 20px; border-radius:6px; color:#fff; font-size:13px; z-index:999; animation:fadeIn .3s; }
.toast.success { background:var(--success); }
.toast.error { background:var(--danger); }
@keyframes fadeIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
.empty-state { text-align:center; padding:40px; color:var(--muted); font-size:13px; }
.stat-row { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:8px; align-items:end; margin-bottom:8px; }
.stat-row input { padding:7px 8px; font-size:12px; }

/* ========== FOOTER ========== */
.footer { background:var(--fg); color:rgba(255,255,255,.5); padding:16px 24px; font-size:11px; letter-spacing:.04em; display:flex; align-items:center; justify-content:space-between; margin-top:auto; }
.footer a { color:rgba(255,255,255,.6); text-decoration:none; transition:color .2s; }
.footer a:hover { color:#fff; }

@media (max-width:768px) {
  .sidebar { display:none; }
  .main { padding:16px; }
  .form-row { grid-template-columns:1fr; }
  .header { padding:12px 16px; }
  .header-logo { font-size:18px; }
  .header-link { display:none; }
}
</style>
</head>
<body>

<!-- ==================== TOP BAR ==================== -->
<div class="top-bar">
  <div>
    <span class="dot green"></span> 系统运行中 · SpringBoot 3.2 · H2
  </div>
  <div>
    <a href="http://localhost:3001" target="_blank" rel="noopener">← 返回前端页面</a>
  </div>
</div>

<!-- ==================== HEADER ==================== -->
<div class="header">
  <div class="header-left">
    <a href="#" class="header-logo" onclick="location.hash='team';renderSection();return false">🦌 鹿映秦华<span>·</span>管理后台</a>
    <div class="header-divider"></div>
    <span class="header-breadcrumb" id="headerBreadcrumb">团队管理</span>
  </div>
  <div class="header-right">
    <span style="font-size:11px;color:var(--muted);">数据 API: <code style="background:var(--bg);padding:2px 6px;border-radius:3px;">/api/site/full</code></span>
    <button class="btn btn-outline btn-sm" onclick="refreshAll()">🔄 刷新数据</button>
  </div>
</div>

<!-- ==================== LAYOUT ==================== -->
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<!-- ==================== FOOTER ==================== -->
<div class="footer">
  <div>&copy; 2025 鹿映秦华实践队 · 内容管理后台</div>
  <div>
    <a href="https://github.com" target="_blank">帮助文档</a> &nbsp;|&nbsp;
    <span id="footerTime"></span>
  </div>
</div>

<div id="toastContainer"></div>

<script>
const API = '';
let SITE_DATA = {};
let ALL_IMAGES = [];

// ==================== NAVIGATION ====================
const MENUS = [
  { id:'team', label:'团队管理', ico:'👥' },
  { id:'culture', label:'文化板块', ico:'🏛️' },
  { id:'products', label:'农产品', ico:'🍑' },
  { id:'documentary', label:'实践纪实', ico:'📷' },
  { id:'closing', label:'页首页尾', ico:'🏁' },
  { id:'hero-slides', label:'Hero大屏', ico:'🔄' },
  { id:'footer-icons', label:'页脚图标', ico:'🔗' },
  { id:'messages', label:'留言管理', ico:'💬' },
  { id:'images', label:'图片管理', ico:'🖼️' },
  { id:'nav', label:'导航设置', ico:'📌' },
];

function renderSidebar() {
  const hash = location.hash.replace('#','') || 'team';
  document.getElementById('sidebar').innerHTML = MENUS.map(m =>
    `<a href="#${m.id}" class="${m.id===hash?'active':''}"><span class="ico">${m.ico}</span>${m.label}</a>`
  ).join('');
  const menu = MENUS.find(m => m.id === hash);
  document.getElementById('headerBreadcrumb').textContent = menu ? '内容管理 / ' + menu.label : '内容管理';
}

// ==================== TOAST ====================
function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// ==================== API HELPERS ====================
async function api(path, method='GET', body=null) {
  const opts = { method, headers:{ 'Content-Type':'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const json = await res.json();
  if (json.code !== 200) throw new Error(json.message || '请求失败');
  return json.data;
}

async function uploadImage(file, group) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('group', group || 'general');
  const res = await fetch(API + '/api/images/upload', { method:'POST', body:fd });
  const json = await res.json();
  if (json.code !== 200) throw new Error(json.message || '上传失败');
  return json.data;
}

// ==================== IMAGE PICKER HELPER ====================
// 生成图片选择器 HTML（输入框 + 上传按钮 + 预览 + 快捷选择）
function imagePicker(id, currentUrl, group) {
  const preview = currentUrl ? `<img src="${currentUrl.startsWith('http')?currentUrl:(API+currentUrl)}" onerror="this.parentElement.innerHTML='<span>? 预览</span>'">` : '<span>📷 预览</span>';
  const imgList = (ALL_IMAGES || []).filter(img => !group || img.group === group || img.group === 'general');
  return `
    <div class="image-upload-area">
      <div class="form-group"><label>${id.includes('hero') ? '封面大图 URL' : '图片URL'}</label>
        <input id="${id}" value="${esc(currentUrl||'')}" placeholder="留空显示占位，或粘贴 /uploads/xxx.jpg" style="font-family:monospace;">
      </div>
      <div class="image-preview" id="${id}-preview">${preview}</div>
      <div class="form-group" style="min-width:120px;"><label>上传新图</label>
        <input type="file" id="${id}-file" accept="image/*" style="padding:7px;font-size:11px;" onchange="uploadAndSet('${id}','${group||'general'}')">
      </div>
    </div>
    ${imgList.length > 0 ? `
    <div style="margin-top:8px;">
      <span style="font-size:10px;color:var(--muted);">快捷选择已上传图片：</span>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;">${imgList.slice(0,8).map(img => `
        <img src="${img.url}" onclick="setImageUrl('${id}','${esc(img.url)}')" title="${esc(img.originalName||'')}" style="width:50px;height:36px;object-fit:cover;border-radius:3px;cursor:pointer;border:2px solid transparent;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='transparent'" loading="lazy">
      `).join('')}</div>
    </div>` : ''}
  `;
}

async function uploadAndSet(inputId, group) {
  const fileInput = document.getElementById(inputId + '-file');
  const file = fileInput.files[0];
  if (!file) return;
  try {
    const result = await uploadImage(file, group);
    document.getElementById(inputId).value = result.url;
    updateImagePreview(inputId, result.url);
    toast('上传成功！');
    // 刷新图片列表缓存
    try { ALL_IMAGES = await api('/api/images'); } catch(e) {}
  } catch(e) { toast(e.message, 'error'); }
}

function setImageUrl(id, url) {
  document.getElementById(id).value = url;
  updateImagePreview(id, url);
}

function updateImagePreview(id, url) {
  const preview = document.getElementById(id + '-preview');
  if (preview) {
    preview.innerHTML = url
      ? `<img src="${url.startsWith('http')?url:(API+url)}" onerror="this.parentElement.innerHTML='<span>? 预览</span>'">`
      : '<span>📷 预览</span>';
  }
}

// ==================== RENDER SECTIONS ====================
async function refreshAll() {
  try {
    SITE_DATA = await api('/api/site/full');
    try { ALL_IMAGES = await api('/api/images'); } catch(e) { ALL_IMAGES = []; }
    renderSection();
    toast('数据已刷新');
  } catch(e) {
    toast(e.message, 'error');
  }
}

function renderSection() {
  const hash = location.hash.replace('#','') || 'team';
  renderSidebar();
  switch(hash) {
    case 'team': renderTeam(); break;
    case 'culture': renderCulture(); break;
    case 'products': renderProducts(); break;
    case 'documentary': renderDocumentary(); break;
    case 'closing': renderClosing(); break;
    case 'hero-slides': renderHeroSlides(); break;
    case 'footer-icons': renderFooterIcons(); break;
    case 'messages': renderMessages(); break;
    case 'images': renderImages(); break;
    case 'nav': renderNav(); break;
  }
}

// ====== TEAM ======
function renderTeam() {
  const info = SITE_DATA.teamInfo || {};
  const stats = SITE_DATA.teamStats || [];
  const achievements = SITE_DATA.teamAchievements || [];

  document.getElementById('main').innerHTML = `
    <div class="section active">
      <h2>👥 团队管理</h2>
      <p class="section-desc">编辑团队介绍、核心数据、成果展示及图片</p>

    <!-- 团队基本信息 -->
    <div class="card">
      <h3>📝 团队基本信息</h3>
      <div class="form-row">
        <div class="form-group"><label>小标签 (eyebrow)</label><input id="tf-eyebrow" value="${esc(info.eyebrow||'')}"></div>
        <div class="form-group"><label>标题</label><input id="tf-title" value="${esc(info.title||'')}"></div>
      </div>
      <div class="form-group"><label>副标题 / Slogan</label><input id="tf-subtitle" value="${esc(info.subtitle||'')}"></div>
      <div class="form-group"><label>团队描述</label><textarea id="tf-desc">${esc(info.description||'')}</textarea></div>
      <div class="form-group"><label>格言</label><textarea id="tf-motto">${esc(info.motto||'')}</textarea></div>
    </div>

    <!-- 团队 LOGO -->
    <div class="card">
      <h3>🔵 团队 LOGO <span class="badge">圆形</span></h3>
      <p style="font-size:11px;color:var(--muted);margin-bottom:12px;">团队圆形 LOGO（建议透明背景 PNG，240×240）— 显示在团队板块</p>
      ${imagePicker('team-logo', info.teamLogoUrl || '', 'team')}
    </div>

    <!-- 团队封面图 -->
    <div class="card">
      <h3>🖼️ 团队封面大图 <span class="badge">Hero</span></h3>
      <p style="font-size:11px;color:var(--muted);margin-bottom:12px;">首屏 Hero 区域的全屏背景大图（建议 1920×1080 以上）</p>
      ${imagePicker('team-hero-img', info.imageUrl || '', 'team')}
    </div>

    <!-- 团队照片 4 张 -->
    <div class="card">
      <h3>📸 团队照片（右侧错落网格）</h3>
      <p style="font-size:11px;color:var(--muted);margin-bottom:12px;">4 张团队纪实照片，用于团队板块右侧的不对称错落布局</p>
      ${(() => {
        const photos = [
          { id: 'team-photo1', url: info.photo1Url, label: info.photo1Label, defaultLabel: '团队合影 · 秦安田间', hint: '大图 (col-span-4 row-span-3) — 主图' },
          { id: 'team-photo2', url: info.photo2Url, label: info.photo2Label, defaultLabel: '田间调研', hint: '右上小图 (col-span-2 row-span-2)' },
          { id: 'team-photo3', url: info.photo3Url, label: info.photo3Label, defaultLabel: '村落走访', hint: '左下 (col-span-3 row-span-2)' },
          { id: 'team-photo4', url: info.photo4Url, label: info.photo4Label, defaultLabel: '小组研讨', hint: '右下 (col-span-3 row-span-2)' },
        ];
        return photos.map(p => `
          <div style="border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;">
            <p style="font-size:11px;color:var(--accent-deep);margin-bottom:6px;font-weight:500;">📷 ${p.hint}</p>
            <div class="form-group" style="margin-bottom:8px;"><label>照片名称</label>
              <input id="${p.id}-label" value="${esc(p.label||p.defaultLabel)}" placeholder="${esc(p.defaultLabel)}">
            </div>
            ${imagePicker(p.id, p.url, 'team')}
          </div>
        `).join('');
      })()}
    </div>

    <!-- 青年愿景 -->
    <div class="card">
      <h3>✨ 青年愿景</h3>
      <div class="form-group"><label>愿景标题（支持 HTML）</label><textarea id="tf-mtitle">${esc(info.missionTitle||'')}</textarea></div>
      <div class="form-group"><label>愿景描述</label><textarea id="tf-mdesc">${esc(info.missionDesc||'')}</textarea></div>
      ${imagePicker('team-mission-img', info.missionImageUrl || '', 'team')}
    </div>

    <button class="btn btn-primary" onclick="saveTeamInfo()" style="margin-bottom:12px;">💾 保存团队信息（以上全部）</button>

    <!-- 核心数据 -->
    <div class="card">
      <h3>📊 核心数据 <span class="badge">滚动计数</span></h3>
      ${stats.map((s,i) => `
        <div class="stat-row">
          <input id="stat-label-${i}" value="${esc(s.label||'')}" placeholder="标签">
          <input id="stat-value-${i}" value="${esc(s.value||'')}" placeholder="数值">
          <input id="stat-suffix-${i}" value="${esc(s.suffix||'')}" placeholder="后缀">
          <div class="btn-group" style="margin-top:0;">
            <button class="btn btn-primary btn-sm" onclick="saveStat(${s.id},${i})">保存</button>
            <label style="font-size:10px;cursor:pointer;display:flex;align-items:center;gap:2px;"><input type="checkbox" id="stat-istext-${i}" ${s.isText?'checked':''}> 纯文本</label>
          </div>
        </div>
      `).join('')}
    </div>

    <!-- 成果条 -->
    <div class="card">
      <h3>🏆 成果展示</h3>
      ${achievements.map((a,i) => `
        <div class="stat-row">
          <input id="ach-label-${i}" value="${esc(a.label||'')}" placeholder="标签">
          <input id="ach-value-${i}" value="${esc(a.value||'')}" placeholder="数值">
          <span></span>
          <button class="btn btn-primary btn-sm" onclick="saveAchievement(${a.id},${i})">保存</button>
        </div>
      `).join('')}
    </div>
    </div>`;
}

async function saveTeamInfo() {
  const body = {
    eyebrow: document.getElementById('tf-eyebrow')?.value || '',
    title: document.getElementById('tf-title')?.value || '',
    subtitle: document.getElementById('tf-subtitle')?.value || '',
    description: document.getElementById('tf-desc')?.value || '',
    missionTitle: document.getElementById('tf-mtitle')?.value || '',
    missionDesc: document.getElementById('tf-mdesc')?.value || '',
    motto: document.getElementById('tf-motto')?.value || '',
    imageUrl: document.getElementById('team-hero-img')?.value || null,
    teamLogoUrl: document.getElementById('team-logo')?.value || null,
    photo1Url: document.getElementById('team-photo1')?.value || null,
    photo1Label: document.getElementById('team-photo1-label')?.value || null,
    photo2Url: document.getElementById('team-photo2')?.value || null,
    photo2Label: document.getElementById('team-photo2-label')?.value || null,
    photo3Url: document.getElementById('team-photo3')?.value || null,
    photo3Label: document.getElementById('team-photo3-label')?.value || null,
    photo4Url: document.getElementById('team-photo4')?.value || null,
    photo4Label: document.getElementById('team-photo4-label')?.value || null,
    missionImageUrl: document.getElementById('team-mission-img')?.value || null,
  };
  try { await api('/api/team/info', 'PUT', body); toast('团队信息已保存'); await refreshAll(); }
  catch(e) { toast(e.message, 'error'); }
}
async function saveStat(id, i) {
  const body = {
    label: document.getElementById(`stat-label-${i}`).value,
    value: document.getElementById(`stat-value-${i}`).value,
    suffix: document.getElementById(`stat-suffix-${i}`).value,
    isText: document.getElementById(`stat-istext-${i}`)?.checked || false,
  };
  try { await api(`/api/team/stats/${id}`, 'PUT', body); toast('数据已保存'); await refreshAll(); }
  catch(e) { toast(e.message, 'error'); }
}

      <div class="btn-group" style="margin-bottom:16px;">

        <button class="btn btn-outline" onclick="renderMessages()">🔄 刷新列表</button>
      </div>
      <div id="addMessageForm" style="display:none;"></div>
    ${messages.length === 0 ? '<div class="card"><div class="empty-state">暂无留言</div></div>' :
      messages.map((m, i) => `
        <div class="card" id="msg-card-${m.id}">
          <div style="display:flex;gap:16px;">
            <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;">
              <div style="width:48px;height:48px;border-radius:50%;overflow:hidden;border:2px solid var(--border);">
                ${m.avatarUrl
                  ? `<img src="${m.avatarUrl.startsWith('http')?m.avatarUrl:(API+m.avatarUrl)}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" /><div style="display:none;width:100%;height:100%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:18px;font-weight:600;">${esc((m.nickname||'匿')[0])}</div>`
                  : `<div style="width:100%;height:100%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;">${esc((m.nickname||'匿')[0])}</div>`
                }
              </div>
              ${imagePicker('msg-'+i+'-avatar', m.avatarUrl || '', 'messages')
                .replace(/图片URL/g,'头像URL').replace(/上传新图/g,'上传头像')}
            </div>
            <div style="flex:1;">
              <div class="form-row">
                <div class="form-group"><label>昵称</label><input id="msg-${i}-nickname" value="${esc(m.nickname||'')}"></div>
                <div class="form-group"><label>邮箱</label><input id="msg-${i}-email" value="${esc(m.email||'')}"></div>
              </div>
              <div class="form-group"><label>留言内容</label><textarea id="msg-${i}-content">${esc(m.content||'')}</textarea></div>
              <div class="form-row">
                <div class="form-group"><label>发布时间</label><input id="msg-${i}-createdAt" type="datetime-local" value="${m.createdAt ? new Date(m.createdAt).toISOString().slice(0,16) : ''}"></div>
                <div class="form-group" style="align-self:end;"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:12px;">
                  <input type="checkbox" id="msg-${i}-enabled" ${m.enabled !== false ? 'checked' : ''}> 展示在留言墙
                </label></div>
              </div>
              <div class="btn-group">
                <button class="btn btn-primary" onclick="saveMessage(${m.id},${i})">💾 保存</button>
                <button class="btn btn-danger" onclick="deleteMessage(${m.id})">🗑 删除</button>
              </div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>`;
}

function showAddMessageForm() {
  const now = new Date().toISOString().slice(0, 16);
  document.getElementById('addMessageForm').style.display = 'block';
  document.getElementById('addMessageForm').innerHTML = `
    <div class="card" style="border:2px dashed var(--accent);">
      <h3>➕ 新增留言</h3>
      <div class="form-row">
        <div class="form-group"><label>昵称 <span style="color:var(--danger)">*</span></label><input id="new-msg-nickname" placeholder="用户昵称"></div>
        <div class="form-group"><label>邮箱</label><input id="new-msg-email" placeholder="选填"></div>
      </div>
      <div class="form-group"><label>留言内容 <span style="color:var(--danger)">*</span></label><textarea id="new-msg-content" placeholder="留言正文..."></textarea></div>
      <div class="form-group"><label>发布时间</label><input id="new-msg-createdAt" type="datetime-local" value="${now}"></div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="addMessage()">💾 确认添加</button>
        <button class="btn btn-outline" onclick="document.getElementById('addMessageForm').style.display='none'">取消</button>
      </div>
    </div>`;
  document.getElementById('addMessageForm').scrollIntoView({ behavior:'smooth' });
}

async function addMessage() {
  const body = {
    nickname: document.getElementById('new-msg-nickname')?.value?.trim() || '',
    email: document.getElementById('new-msg-email')?.value?.trim() || '',
    content: document.getElementById('new-msg-content')?.value?.trim() || '',
    createdAt: document.getElementById('new-msg-createdAt')?.value || null,
    enabled: true,
  };
  if (!body.nickname) { toast('昵称不能为空', 'error'); return; }
  if (!body.content) { toast('留言内容不能为空', 'error'); return; }
  try { await api('/api/messages', 'POST', body); toast('留言已添加'); await renderMessages(); }
  catch(e) { toast(e.message, 'error'); }
}

async function saveMessage(id, i) {
  const body = {
    nickname: document.getElementById('msg-'+i+'-nickname')?.value || '',
    email: document.getElementById('msg-'+i+'-email')?.value || '',
    content: document.getElementById('msg-'+i+'-content')?.value || '',
    avatarUrl: document.getElementById('msg-'+i+'-avatar')?.value || null,
    createdAt: document.getElementById('msg-'+i+'-createdAt')?.value ? new Date(document.getElementById('msg-'+i+'-createdAt').value).toISOString() : null,
    enabled: document.getElementById('msg-'+i+'-enabled')?.checked,
  };
  try { await api('/api/messages/'+id, 'PUT', body); toast('留言已保存'); await renderMessages(); }
  catch(e) { toast(e.message, 'error'); }
}

async function deleteMessage(id) {
  if (!confirm('确认删除此留言？此操作不可撤销。')) return;
  try { await api('/api/messages/'+id, 'DELETE'); toast('留言已删除'); await renderMessages(); }
  catch(e) { toast(e.message, 'error'); }
}

// ==================== UTILS ====================
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\\/g,'\\\\');
}
function formatSize(bytes) { if (!bytes) return '0 B'; if (bytes<1024) return bytes+' B'; if (bytes<1048576) return (bytes/1024).toFixed(1)+' KB'; return (bytes/1048576).toFixed(1)+' MB'; }

// ==================== ROUTING ====================
window.addEventListener('hashchange', () => {
  renderSection();
});

// ==================== INIT ====================
(async function init() {
  document.getElementById('footerTime').textContent = '已运行 ' + new Date().toLocaleString('zh-CN');
  try {
    SITE_DATA = await api('/api/site/full');
    try { ALL_IMAGES = await api('/api/images'); } catch(e) { ALL_IMAGES = []; }
  } catch(e) {
    console.warn('无法加载全站数据:', e.message);
  }
  renderSection();
})();
</script>
</body>
</html>
